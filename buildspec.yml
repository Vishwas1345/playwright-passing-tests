version: 0.2

# Sharded Playwright run for AWS CodeBuild, streaming live to TestDino.
#
# PREREQUISITES:
#   1. Enable "Batch build" on the CodeBuild project (build-list below fans out
#      into 4 parallel shard builds).
#   2. Set the project env var TESTDINO_TOKEN to your TestDino token.
#
# NOTE: All shards share TESTDINO_CI_RUN_ID so TestDino groups them into one
# logical run. CodeBuild batch exposes no batch-unique id across child builds,
# so we key on the resolved commit sha. Caveat: re-running the batch on the
# exact same commit will group into the same TestDino run.

batch:
  fast-fail: false
  build-list:
    - identifier: shard1
      env:
        variables: { PW_SHARD: "1", PW_TOTAL: "4" }
    - identifier: shard2
      env:
        variables: { PW_SHARD: "2", PW_TOTAL: "4" }
    - identifier: shard3
      env:
        variables: { PW_SHARD: "3", PW_TOTAL: "4" }
    - identifier: shard4
      env:
        variables: { PW_SHARD: "4", PW_TOTAL: "4" }

env:
  variables:
    NODE_ENV: test
    TESTDINO_SERVER_URL: https://analytics.testdino.com

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - npm ci
      - npx playwright install --with-deps

  build:
    commands:
      - export TESTDINO_CI_RUN_ID=$CODEBUILD_RESOLVED_SOURCE_VERSION
      - npx playwright test --shard=$PW_SHARD/$PW_TOTAL || true
