name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tdpw version
        run: |
          VERSION=$(node -p "require('./node_modules/tdpw/package.json').version")
          echo "Installed tdpw version: $VERSION"
          if [ "$VERSION" != "1.0.37" ]; then
            echo "::error::Expected tdpw 1.0.37 but got $VERSION"
            exit 1
          fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test || true

      - name: Inspect token shape (debug)
        if: always()
        env:
          TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
          TESTDINO_API_URL: ${{ secrets.TESTDINO_API_URL }}
        run: |
          node -e "
            const t = process.env.TESTDINO_TOKEN || '';
            const u = process.env.TESTDINO_API_URL || '';
            console.log('token.present=' + (t.length > 0));
            console.log('token.length=' + t.length);
            console.log('token.hasWhitespace=' + /\s/.test(t));
            console.log('token.matchesFormat=' + /^trx_(development|staging|production)_[a-f0-9]{64}$/.test(t));
            console.log('apiUrl.present=' + (u.length > 0));
            console.log('apiUrl.length=' + u.length);
          "

      - name: Upload to TestDino
        if: always()
        env:
          TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
          TESTDINO_API_URL: ${{ secrets.TESTDINO_API_URL }}
        run: npx tdpw upload ./playwright-report --upload-html --upload-traces --verbose

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
